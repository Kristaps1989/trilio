name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trilio
          POSTGRES_PASSWORD: trilio
          POSTGRES_DB: trilio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trilio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://trilio:trilio@localhost:5432/trilio
      CRON_SECRET: ci-only-secret
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-not-for-production
      AUTH_DEV_LOGIN: "1"
      PAYMENTS_PROVIDER: mock
      ALLOW_INSECURE_TEST_FEATURES: "1"
      # A fake GA4 id so the e2e suite exercises the consent banner and events (requests are stubbed).
      GA_MEASUREMENT_ID: G-TEST12345
      PAYMENT_TOKEN_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - name: Unit tests
        run: npm run test -- --coverage
      - name: Build (no database or app secrets, like Railway's build step)
        # Railway's build cannot reach the database; a build that needs it must fail here first.
        # Only the app's own variables are removed: the runner's system environment stays.
        run: >-
          env -u DATABASE_URL -u CRON_SECRET -u APP_URL -u AUTH_URL -u AUTH_SECRET
          -u AUTH_DEV_LOGIN -u PAYMENTS_PROVIDER -u ALLOW_INSECURE_TEST_FEATURES -u PAYMENT_TOKEN_KEY
          npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (360 px and desktop)
        run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
